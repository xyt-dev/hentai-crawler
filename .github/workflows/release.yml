name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build for ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ehentai-crawler
            asset_name: ehentai-crawler-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ehentai-crawler.exe
            asset_name: ehentai-crawler-windows-x86_64.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ehentai-crawler
            asset_name: ehentai-crawler-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ehentai-crawler
            asset_name: ehentai-crawler-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux: install OpenSSL
      - name: Install OpenSSL (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # macOS aarch64: tell openssl-sys where to find the library
      - name: Set OpenSSL env (macOS aarch64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f ehentai-crawler.exe ]; then
            mv ehentai-crawler.exe ${{ matrix.asset_name }}
          else
            mv ehentai-crawler ${{ matrix.asset_name }}
          fi

      - name: Upload binary to release
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
