[package]
name = "ehentai-crawler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ehentai-crawler"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
zip = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
futures = "0.3"
regex = "1"
bytes = "1"
num_cpus = "1"
